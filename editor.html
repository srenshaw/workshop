<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Network Editor</title>
  <style>
    table, th, td {
      border: 1px solid black;
      border-collapse: collapse;
    }
    th, td {
      width: 50px;
      height: 50px;
      text-align: center;
      vertical-align: middle;
    }
    input {
      width: 90%;
      text-align: center;
      border: none;
      font-size: 16px;
      background: transparent;
    }
  </style>
</head>
<body>
  <h1>Network Editor</h1>
  <p>
    <label>
      <input type="checkbox" id="simplexCheckbox">
      Simplex Network (symmetric ties)
    </label>
    <br>
    (When unchecked, the network is directional and ties are shown with an arrow.)
  </p>
  <p>
    Note: All grid cells start at 0. Type a 1 in a cell to indicate a tie.
  </p>
  <table id="networkTable"></table>

  <script>
    // Define the nodes for the network.
    const nodes = ['A', 'B', 'C', 'D', 'E'];
    const simplexCheckbox = document.getElementById('simplexCheckbox');
    const table = document.getElementById('networkTable');

    // Build the table header.
    const headerRow = document.createElement('tr');
    let blankHeader = document.createElement('th');
    headerRow.appendChild(blankHeader);
    nodes.forEach(node => {
      let th = document.createElement('th');
      th.textContent = node;
      headerRow.appendChild(th);
    });
    table.appendChild(headerRow);

    // Build each row of the grid.
    for (let i = 0; i < nodes.length; i++) {
      const row = document.createElement('tr');
      // Row header.
      const rowHeader = document.createElement('th');
      rowHeader.textContent = nodes[i];
      row.appendChild(rowHeader);

      // Create a cell for each column.
      for (let j = 0; j < nodes.length; j++) {
        const cell = document.createElement('td');
        // Create an input for the tie value.
        const input = document.createElement('input');
        input.type = 'text';
        input.value = '0'; // All cells start at 0.
        // Save row and column indices for later use.
        input.dataset.row = i;
        input.dataset.col = j;
        // When the user changes the cell, handle the update.
        input.addEventListener('change', handleInputChange);
        cell.appendChild(input);
        row.appendChild(cell);
      }
      table.appendChild(row);
    }

    // Update a cell when its value is changed.
    function handleInputChange(event) {
      const input = event.target;
      const row = parseInt(input.dataset.row);
      const col = parseInt(input.dataset.col);
      // Trim the input value.
      let val = input.value.trim();

      // Only a "1" is accepted as a tie; everything else resets to "0".
      if (val === '1') {
        // Check the network mode.
        if (simplexCheckbox.checked) {
          // In simplex mode, a tie from A to B must also set the tie from B to A.
          input.value = '1';
          input.style.backgroundColor = '#cfc'; // greenish background for a tie.
          const symmetricInput = document.querySelector(`input[data-row='${col}'][data-col='${row}']`);
          if (symmetricInput) {
            symmetricInput.value = '1';
            symmetricInput.style.backgroundColor = '#cfc';
          }
        } else {
          // In directional mode, display an arrow to indicate direction.
          input.value = '→';
          input.style.backgroundColor = '#ccf'; // bluish background for directional tie.
        }
      } else {
        // Any non-"1" entry resets the cell to 0.
        input.value = '0';
        input.style.backgroundColor = '#fff';
        // For simplex mode, also clear the symmetric cell.
        if (simplexCheckbox.checked) {
          const symmetricInput = document.querySelector(`input[data-row='${col}'][data-col='${row}']`);
          if (symmetricInput) {
            symmetricInput.value = '0';
            symmetricInput.style.backgroundColor = '#fff';
          }
        }
      }
    }
  </script>
</body>
</html>
